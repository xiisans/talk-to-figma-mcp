<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XiiSANS — WebSocket MCP</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-muted: #f6f6f6;
        --border: rgba(17, 17, 17, 0.05);
        --card-border: rgba(17, 17, 17, 0.1);
        --text: #111111;
        --muted: rgba(17, 17, 17, 0.4);
        --icon: rgba(17, 17, 17, 0.3);
        --primary: #3e52ff;
        --primary-hover: #5165ff;
        --primary-soft: rgba(62, 128, 252, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2c2c2c;
          --surface: #2c2c2c;
          --surface-muted: #333333;
          --border: rgba(255, 255, 255, 0.05);
          --card-border: rgba(255, 255, 255, 0.1);
          --text: #ffffff;
          --muted: rgba(255, 255, 255, 0.4);
          --icon: rgba(255, 255, 255, 0.3);
          --primary: #2f46ff;
          --primary-hover: #1e35ed;
          --primary-soft: rgba(62, 128, 252, 0.1);
        }
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        padding: 20px 20px 16px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      button, input { font: inherit; }
      button { border: 0; cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.65; }
      .app { width: 320px; margin: 0 auto; }
      .locale-switch {
        position: relative;
        display: flex;
        gap: 2px;
        width: 70px;
        height: 24px;
        padding: 2px;
        margin: 0 auto 20px;
        border-radius: 4px;
        background: var(--surface-muted);
      }
      .locale-switch::before {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 32px;
        height: 20px;
        border-radius: 2px;
        background: var(--surface);
        content: "";
        transition: transform 180ms ease;
      }
      .locale-switch.is-cn::before { transform: translateX(34px); }
      .locale-button {
        position: relative;
        width: 32px;
        height: 20px;
        padding: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        line-height: 20px;
        transition: color 300ms ease;
      }
      .locale-button:not(.active):hover {
        color: var(--text);
      }
      .locale-button.active {
        color: var(--text);
      }
      @media (prefers-reduced-motion: reduce) {
        .locale-switch::before { transition: none; }
      }
      .channel-card, .copy-card {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
      }
      .channel-card {
        height: 132px;
        padding: 22px 16px 16px;
        border-color: var(--card-border);
        text-align: center;
      }
      .channel-label {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 12px;
      }
      .channel-value {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        color: var(--text);
        font-size: 24px;
        font-weight: 500;
        line-height: 24px;
        letter-spacing: -1px;
      }
      .channel-prefix { margin-right: 8px; }
      .channel-number {
        width: 94px;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: inherit;
        letter-spacing: inherit;
        text-align: left;
      }
      .channel-number:disabled { opacity: 1; }
      .channel-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        width: 49px;
        height: 20px;
        margin: 8px auto 0;
      }
      .icon-button {
        position: relative;
        flex: 0 0 12px;
        width: 12px;
        height: 12px;
        padding: 0;
        background: transparent;
        color: var(--icon);
        transition: color 300ms ease;
      }
      .icon-button::before {
        position: absolute;
        inset: -6px;
        content: "";
      }
      .icon-button:hover, .icon-button:focus-visible { color: var(--text); }
      .icon-separator {
        flex: 0 0 1px;
        height: 12px;
        background: var(--border);
      }
      .icon-button svg { display: block; width: 12px; height: 12px; }
      .primary-button, .connected-button {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 14px;
      }
      .primary-button {
        width: 100%;
        height: 40px;
        margin-top: 20px;
        border-radius: 4px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        transition: background 300ms ease;
      }
      .primary-button:not(:disabled):hover {
        background: var(--primary-hover);
      }
      .loading-dots {
        display: block;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: -6px 0 currentColor, 6px 0 currentColor;
      }
      .port {
        margin-top: 20px;
        color: var(--muted);
        font-size: 12px;
        line-height: 12px;
        text-align: center;
      }
      .connected-view { display: none; }
      .connected-view.visible { display: block; }
      .disconnected-view.hidden { display: none; }
      .copy-card {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 64px;
        margin-bottom: 8px;
        padding: 12px 56px 12px 16px;
        border-color: var(--card-border);
      }
      .copy-label {
        flex: 0 0 58px;
        color: var(--muted);
        font-size: 12px;
        line-height: 18px;
      }
      .copy-value {
        color: var(--text);
        font-size: 12px;
        font-weight: 500;
        line-height: 18px;
        word-break: break-word;
      }
      .copy-button {
        position: absolute;
        top: 50%;
        right: 16px;
        display: grid;
        width: 24px;
        height: 24px;
        padding: 0;
        place-items: center;
        transform: translateY(-50%);
        border-radius: 2px;
        background: var(--primary);
        color: #ffffff;
        transition: background 300ms ease;
      }
      .copy-button:not(:disabled):hover {
        background: var(--primary-hover);
      }
      .copy-button svg { display: block; width: 12px; height: 12px; }
      .connected-button {
        width: 100%;
        height: 40px;
        margin-top: 16px;
        border-radius: 4px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 14px;
        font-weight: 500;
        transition: background 300ms ease;
      }
      .connected-button:not(:disabled):hover {
        background: rgba(62, 128, 252, 0.05);
      }
      .progress-container { display: none; }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="locale-switch" role="group" aria-label="Language">
        <button id="locale-en" class="locale-button active" type="button">EN</button>
        <button id="locale-cn" class="locale-button" type="button">CN</button>
      </div>

      <section id="disconnected-view" class="disconnected-view">
        <div class="channel-card">
          <div id="channel-label" class="channel-label">CHANNEL</div>
          <div class="channel-value">
            <span class="channel-prefix">WS</span>
            <input id="channel-number" class="channel-number" value="668888" inputmode="numeric" maxlength="6" aria-label="Channel number" />
          </div>
          <div class="channel-actions">
            <button id="refresh-channel" class="icon-button" type="button" aria-label="Refresh channel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 0 0-14.5-4.9L3 8"/><path d="M3 3v5h5"/><path d="M4 13a8.1 8.1 0 0 0 14.5 4.9L21 16"/><path d="M21 21v-5h-5"/></svg>
            </button>
            <span class="icon-separator" aria-hidden="true"></span>
            <button id="edit-channel" class="icon-button" type="button" aria-label="Edit channel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
            </button>
          </div>
        </div>
        <button id="btn-connect" class="primary-button" type="button">Connect</button>
      </section>

      <section id="connected-view" class="connected-view">
        <div class="copy-card">
          <div id="copy-channel-label" class="copy-label">Channel</div>
          <div id="copy-channel-value" class="copy-value"></div>
          <button id="copy-channel" class="copy-button" type="button" aria-label="Copy channel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
        <div class="copy-card">
          <div id="copy-ai-label" class="copy-label">AI Chat</div>
          <div id="copy-ai-value" class="copy-value"></div>
          <button id="copy-ai" class="copy-button" type="button" aria-label="Copy AI prompt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
        <button id="btn-disconnect" class="connected-button" type="button">Connected</button>
      </section>

      <div class="port">WebSocket Server Port: <span id="port-value">3055</span></div>
      <div id="progress-container" class="progress-container"><div id="progress-message"></div><div id="progress-status"></div><div id="progress-percentage"></div></div>
    </main>

    <script>
      const state = {
        connected: false,
        socket: null,
        serverPort: 3055,
        pendingRequests: new Map(),
        commandTracking: new Map(),
        channel: "WS668888",
        locale: "en",
        usedNumbers: new Set(["668888"]),
        activeRequestId: null,
      };

      // --- Anonymous analytics (GA4 Measurement Protocol) ---
      const analytics = (() => {
        const MEASUREMENT_ID = "G-9YH0ER9BXC";
        const API_SECRET = "Xqiy0AtbQt-Xbx4bdoc8Kw";
        // Set ?_dbg=1 on the parent URL or window.__ANALYTICS_DEBUG__ = true
        // to route events through GA4 DebugView and log validation errors.
        const DEBUG = window.__ANALYTICS_DEBUG__ === true;
        const HOST = "https://www.google-analytics.com";
        const PATH = DEBUG ? "/debug/mp/collect" : "/mp/collect";
        const ENDPOINT =
          HOST +
          PATH +
          "?measurement_id=" +
          MEASUREMENT_ID +
          "&api_secret=" +
          API_SECRET;
        const sessionId = Date.now().toString();
        const sessionStart = Date.now();
        let clientId = null;
        const queue = [];

        function send(name, params) {
          const eventParams = Object.assign(
            {
              session_id: sessionId,
              engagement_time_msec: Math.max(100, Date.now() - sessionStart),
            },
            params || {}
          );
          if (DEBUG) eventParams.debug_mode = 1;
          const body = {
            client_id: clientId,
            events: [{ name, params: eventParams }],
          };
          try {
            const req = fetch(ENDPOINT, {
              method: "POST",
              body: JSON.stringify(body),
              keepalive: true,
            });
            if (DEBUG) {
              req
                .then((r) => r.json())
                .then((j) => console.log("[analytics debug]", name, j))
                .catch((e) => console.warn("[analytics debug] error", e));
            } else {
              req.catch(() => {});
            }
          } catch (e) {
            // analytics must never break the plugin
          }
        }

        return {
          track(event, params) {
            if (!clientId) {
              queue.push([event, params]);
              return;
            }
            send(event, params);
          },
          setClientId(id) {
            clientId = id;
            while (queue.length) {
              const [e, p] = queue.shift();
              send(e, p);
            }
          },
        };
      })();
      analytics.track("plugin_open");

      const copy = {
        en: {
          title: "CHANNEL",
          channel: "Channel",
          aiChat: "AI Chat",
          connect: "Connect",
          connecting: "Connecting",
          connected: "Connected",
          disconnect: "Disconnect",
          copied: "Copied Successfully, Go to AI Chat",
          connectFirst: "Start the websocket client first before attempting to connect",
          prompt: (channel) => `join_channel: ${channel}, Show File Name of Current Channel`,
        },
        cn: {
          title: "频道码",
          channel: "频道码",
          aiChat: "加入AI",
          connect: "连接",
          connecting: "连接中",
          connected: "已连接",
          disconnect: "断开连接",
          copied: "复制成功，快去AI对话",
          connectFirst: "请先开启 WebSocket 客户端，再尝试连接",
          prompt: (channel) => `join_channel: ${channel}, 告诉我当前频道的文件名称`,
        },
      };

      const $ = (id) => document.getElementById(id);
      const channelNumber = $("channel-number");
      const connectButton = $("btn-connect");
      const disconnectButton = $("btn-disconnect");
      const disconnectedView = $("disconnected-view");
      const connectedView = $("connected-view");
      const copyChannelValue = $("copy-channel-value");
      const copyAiValue = $("copy-ai-value");

      function postPluginMessage(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      function currentChannel() {
        return "WS" + channelNumber.value;
      }

      function saveSettings() {
        if (!/^\d{6}$/.test(channelNumber.value)) return;
        state.channel = currentChannel();
        state.usedNumbers.add(channelNumber.value);
        postPluginMessage({ type: "update-settings", serverPort: state.serverPort, channel: state.channel, usedNumbers: Array.from(state.usedNumbers) });
      }

      function renderLocale() {
        const language = copy[state.locale];
        document.querySelector(".locale-switch").classList.toggle("is-cn", state.locale === "cn");
        $("locale-en").classList.toggle("active", state.locale === "en");
        $("locale-cn").classList.toggle("active", state.locale === "cn");
        $("locale-en").setAttribute("aria-pressed", state.locale === "en");
        $("locale-cn").setAttribute("aria-pressed", state.locale === "cn");
        $("channel-label").textContent = language.title;
        $("copy-channel-label").textContent = language.channel;
        $("copy-ai-label").textContent = language.aiChat;
        connectButton.textContent = language.connect;
        disconnectButton.textContent = language.connected;
        renderConnectedContent();
      }

      function renderConnectedContent() {
        copyChannelValue.textContent = state.channel;
        copyAiValue.textContent = copy[state.locale].prompt(state.channel);
      }

      function showConnected(isConnected) {
        state.connected = isConnected;
        connectButton.disabled = isConnected || channelNumber.value.length !== 6;
        disconnectedView.classList.toggle("hidden", isConnected);
        connectedView.classList.toggle("visible", isConnected);
        channelNumber.disabled = isConnected;
        renderLocale();
      }

      function generateChannelNumber() {
        if (state.usedNumbers.size >= 1000000) return channelNumber.value;
        let value;
        do {
          value = String(Math.floor(Math.random() * 1000000)).padStart(6, "0");
        } while (state.usedNumbers.has(value));
        state.usedNumbers.add(value);
        return value;
      }

      function setChannel(channel) {
        const match = /^WS(\d{6})$/.exec(String(channel || ""));
        channelNumber.value = match ? match[1] : "668888";
        state.channel = currentChannel();
        connectButton.disabled = false;
        renderConnectedContent();
      }

      function updateConnectionStatus(isConnected) {
        showConnected(isConnected);
      }

      function connectToServer() {
        if (state.connected || state.socket || !/^\d{6}$/.test(channelNumber.value)) return;
        state.channel = currentChannel();
        saveSettings();
        connectButton.disabled = true;
        const loadingDots = document.createElement("span");
        loadingDots.className = "loading-dots";
        loadingDots.setAttribute("role", "status");
        loadingDots.setAttribute("aria-label", copy[state.locale].connecting);
        connectButton.replaceChildren(loadingDots);
        // Track whether the socket ever opened. If it never did and we hit
        // close/error, the relay server isn't running — surface a native
        // red Figma toast that stays until the user dismisses it.
        let everOpened = false;
        const notifyServerDown = () => {
          postPluginMessage({
            type: "notify",
            message: copy[state.locale].connectFirst,
            options: { error: true },
          });
        };
        try {
          state.socket = new WebSocket(`ws://localhost:${state.serverPort}`);
        } catch (error) {
          console.error("Connection error", error);
          updateConnectionStatus(false);
          notifyServerDown();
          return;
        }
        state.socket.onopen = () => {
          everOpened = true;
          state.socket.send(JSON.stringify({ type: "join", channel: state.channel }));
        };
        state.socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "system" && data.message && data.message.result) {
              state.channel = data.channel || state.channel;
              renderConnectedContent();
              updateConnectionStatus(true);
              analytics.track("channel_join", { port: state.serverPort, channel: state.channel });
              postPluginMessage({ type: "notify", message: `Connected to Cursor MCP server in channel: ${state.channel}` });
            } else if (data.type === "error") {
              state.socket.close();
            }
            handleSocketMessage(data);
          } catch (error) {
            console.error("Error parsing WebSocket message", error);
          }
        };
        state.socket.onclose = () => {
          const failedToConnect = !everOpened;
          state.socket = null;
          updateConnectionStatus(false);
          if (failedToConnect) notifyServerDown();
        };
        state.socket.onerror = () => {
          // onerror is followed by onclose; let onclose own the toast so it
          // isn't shown twice. Just clear state here.
          state.socket = null;
          updateConnectionStatus(false);
        };
      }

      function disconnectFromServer() {
        if (state.socket) state.socket.close();
        state.socket = null;
        updateConnectionStatus(false);
      }

      async function handleSocketMessage(payload) {
        const data = payload.message || {};
        if (data.id && state.pendingRequests.has(data.id)) {
          const request = state.pendingRequests.get(data.id);
          state.pendingRequests.delete(data.id);
          data.error ? request.reject(new Error(data.error)) : request.resolve(data.result);
          return;
        }
        if (data.command) {
          state.activeRequestId = data.id;
          state.commandTracking.set(data.id, { command: data.command, startedAt: Date.now() });
          postPluginMessage({ type: "execute-command", id: data.id, command: data.command, params: data.params });
        }
      }

      function sendSuccessResponse(id, result) {
        if (!state.socket) return;
        state.socket.send(JSON.stringify({ id, type: "message", channel: state.channel, message: { id, result } }));
      }

      function sendErrorResponse(id, error) {
        if (!state.socket) return;
        state.socket.send(JSON.stringify({ id, type: "message", channel: state.channel, message: { id, error, result: {} } }));
      }

      function sendProgressUpdateToServer(progressData) {
        if (!state.socket) return;
        const id = state.activeRequestId || progressData.commandId;
        state.socket.send(JSON.stringify({ id, type: "progress_update", channel: state.channel, message: { id, type: "progress_update", data: progressData } }));
      }

      function trackCommandResult(id, success, errorMessage) {
        const meta = state.commandTracking.get(id);
        if (!meta) return;
        state.commandTracking.delete(id);
        analytics.track("command_executed", { command_name: String(meta.command), success: success ? 1 : 0, duration_ms: Date.now() - meta.startedAt, error_message: errorMessage || "" });
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      async function copyText(text) {
        const fallback = () => {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("Clipboard copy failed");
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try { await navigator.clipboard.writeText(text); } catch (error) { fallback(); }
          } else fallback();
          postPluginMessage({ type: "notify", message: copy[state.locale].copied });
        } catch (error) {
          console.error("Clipboard copy failed", error);
        }
      }

      $("locale-en").addEventListener("click", () => { state.locale = "en"; renderLocale(); });
      $("locale-cn").addEventListener("click", () => { state.locale = "cn"; renderLocale(); });
      channelNumber.addEventListener("input", () => {
        channelNumber.value = channelNumber.value.replace(/\D/g, "").slice(0, 6);
        connectButton.disabled = channelNumber.value.length !== 6;
        if (channelNumber.value.length === 6) saveSettings();
      });
      channelNumber.addEventListener("blur", () => {
        if (channelNumber.value.length !== 6) setChannel(state.channel);
      });
      $("refresh-channel").addEventListener("click", () => {
        channelNumber.value = generateChannelNumber();
        saveSettings();
      });
      $("edit-channel").addEventListener("click", () => {
        channelNumber.focus();
        channelNumber.select();
      });
      connectButton.addEventListener("click", connectToServer);
      disconnectButton.addEventListener("click", disconnectFromServer);
      disconnectButton.addEventListener("mouseenter", () => { disconnectButton.textContent = copy[state.locale].disconnect; });
      disconnectButton.addEventListener("mouseleave", () => { disconnectButton.textContent = copy[state.locale].connected; });
      $("copy-channel").addEventListener("click", () => copyText(state.channel));
      $("copy-ai").addEventListener("click", () => copyText(copy[state.locale].prompt(state.channel)));

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        switch (message.type) {
          case "init-settings":
            state.serverPort = message.settings.serverPort || 3055;
            $("port-value").textContent = state.serverPort;
            setChannel(message.settings.channel || "WS668888");
            state.usedNumbers = new Set((message.settings.usedNumbers || []).filter((number) => /^\d{6}$/.test(number)));
            state.usedNumbers.add(channelNumber.value);
            break;
          case "command-result":
            sendSuccessResponse(message.id, message.result);
            trackCommandResult(message.id, true);
            break;
          case "command-error":
            sendErrorResponse(message.id, message.error);
            trackCommandResult(message.id, false, message.error);
            break;
          case "command_progress":
            sendProgressUpdateToServer(message);
            break;
          case "analytics-client-id":
            analytics.setClientId(message.clientId);
            break;
        }
      };

      renderLocale();
      setChannel("WS668888");
    </script>
  </body>
</html>
